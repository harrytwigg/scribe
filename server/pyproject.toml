[project]
name = "scribe-server"
version = "0.1.0"
description = "Local ASR server for scribe: swappable open-source models, sessions, web GUI"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "python-multipart>=0.0.20",
  "numpy>=2.0",
  "soundfile>=0.13",
  "soxr>=0.5",
  "huggingface-hub>=0.30",
  "faster-whisper==1.2.1",
  "onnx-asr[hub]==0.12.0",
  # CUDA 12 build. 1.27+ on PyPI is CUDA 13 and rejects models laid out as the HF cache does
  # (docs/spec.md, section 2). CTranslate2 needs the same CUDA 12 / cuDNN 9 libraries.
  "onnxruntime-gpu[cuda,cudnn]==1.24.4",
  "nvidia-cublas-cu12",
  "sherpa-onnx==1.13.8",
  "sherpa-onnx-core==1.13.8",
  "av>=19.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.28",
    "playwright>=1.63.0",
]

[project.scripts]
scribe-server = "scribe_server.__main__:main"
scribe = "scribe_server.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scribe_server"]

[tool.pytest.ini_options]
markers = [
  "gpu: runs real models on the GPU and downloads them (slow)",
  "gui: drives the GUI in Chromium against a real server on the GPU",
  "extension: loads the Chrome extension in Chromium against a real server on the GPU",
]
addopts = "-m 'not gpu and not gui and not extension'"

[tool.uv]
# faster-whisper depends on CPU `onnxruntime` (for its VAD). It installs into the same `onnxruntime`
# package directory as onnxruntime-gpu, so whichever was installed last wins, and a reinstall could
# silently leave CPU ORT 1.31 where the GPU 1.24.4 build should be. onnxruntime-gpu provides the
# same module, so the CPU package is dropped.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]
